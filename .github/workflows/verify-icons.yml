name: Verify Icon Mappings

on:
  schedule:
    - cron: '0 9 * * 1'  # Mondays 09:00 UTC
  push:
    paths:
      - 'icons.json'
      - 'scripts/verify_icons.py'
      - '.github/workflows/verify-icons.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Check against the spec's upstream HEAD, not the pinned gitlink, so the weekly run sees new enum values.
      - name: Fetch latest API spec
        run: git submodule update --init --remote --depth 1 api-docs

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Verify icon mappings against API spec
        run: uv run scripts/verify_icons.py
