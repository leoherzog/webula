<!DOCTYPE html>
<!-- Cloudflare Pages serves this with a 404 for any missing path at any depth, so its URLs are root-absolute. Deleting it turns Pages' single-page fallback back on, which answers every path with index.html. -->
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found · Webula</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0e1118">
  <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" crossorigin="anonymous">
</head>
<body>
  <main class="container">
    <h1>Page not found</h1>
    <p>Webula has no page at this address.</p>
    <p><a href="/" role="button">Open Webula</a></p>
  </main>
</body>
</html>
